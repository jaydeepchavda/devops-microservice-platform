apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-platform-app
  namespace: devops-platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-platform

  template:
    metadata:
      labels:
        app: devops-platform

    spec:
      containers:
        - name: devops-platform-container
          image: devops-platform:v1

          imagePullPolicy: Never

          ports:
            - containerPort: 3000

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20